<div class="container py-5 mt-5 text-white">

  <div class="text-center mb-5">
    <span class="text-warning font-monospace fs-5 text-uppercase">Minijuego Manila</span>
    <h2 class="display-4 fw-bold text-uppercase">Encuentra el Plato y la Bebida</h2>
    <p class="text-secondary">Explora la matriz de 4x4 y descubre las imágenes ocultas de la casa</p>
  </div>

  <div class="row justify-content-center mb-4">
    <div class="col-md-8">
      <div class="card bg-dark border-warning p-3 rounded-4 shadow-lg d-flex flex-row justify-content-around align-items-center text-center">
        <div>
          <span class="text-secondary small d-block">INTENTOS</span>
          <span class="fs-4 fw-bold text-white">{{ intentos }}</span>
        </div>
        <div class="border-start border-secondary h-100"></div>
        <div>
          <span class="text-secondary small d-block">RONDAS</span>
          <span class="fs-4 fw-bold text-white">{{ rondas }}</span>
        </div>
        <div class="border-start border-secondary h-100"></div>
        <div>
          <span class="text-secondary small d-block">ESTADO</span>
          <span class="fs-6 fw-bold text-warning">{{ estado }}</span>
        </div>
        <div class="border-start border-secondary h-100"></div>
        <div>
          <button type="button" class="btn btn-warning btn-sm fw-bold px-3 rounded-pill text-dark" (click)="reiniciar()">
            REINICIAR
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="row g-3">

        <div class="col-3" *ngFor="let celda of celdas; let i = index">
          <div class="card bg-dark border-secondary text-center rounded-4 shadow overflow-hidden h-100 d-flex align-items-center justify-content-center"
               style="aspect-ratio: 1;"
               [style.cursor]="celda.abierta || bloqueado ? 'default' : 'pointer'"
               (click)="destapar(i)">

            <span *ngIf="!celda.abierta"
                  class="text-warning fw-bold fs-5 border border-warning rounded-4 w-100 h-100 d-flex align-items-center justify-content-center">
              ?
            </span>

            <img *ngIf="celda.abierta && celda.contenido === 'plato'"
                 [src]="imagenPlato" [alt]="nombrePlato" title="{{ nombrePlato }}"
                 class="w-100 h-100" style="object-fit: cover;">

            <img *ngIf="celda.abierta && celda.contenido === 'bebida'"
                 [src]="imagenBebida" [alt]="nombreBebida" title="{{ nombreBebida }}"
                 class="w-100 h-100" style="object-fit: cover;">

            <span *ngIf="celda.abierta && celda.contenido === 'vacio'" class="text-secondary fs-4">✖</span>

          </div>
        </div>

      </div>
    </div>
  </div>

</div>
