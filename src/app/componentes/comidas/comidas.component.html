<div class="container py-5 mt-5 text-white">

  <div class="text-center mb-5">
    <span class="text-warning font-monospace fs-5 text-uppercase">Nuestro Menú</span>
    <h2 class="display-4 fw-bold text-uppercase">Comidas y Especialidades</h2>
    <p class="text-secondary">Explora nuestros deliciosos platillos preparados con el toque único de Manila</p>
  </div>

  <div class="row justify-content-center mb-5 g-4">

    <div class="col-md-6">
      <label class="form-label text-warning small fw-bold mb-2">BUSCAR POR NOMBRE DEL PLATILLO</label>
      <div class="input-group bg-dark p-2 rounded-pill border border-secondary shadow">
        <input type="text" class="form-control bg-transparent text-white border-0 shadow-none px-3"
               placeholder="Ej: Arrabiata, Pie, Chicken..."
               [(ngModel)]="nombreBusqueda" name="nombreBusqueda"
               (keyup.enter)="buscarPorNombre()">
        <button type="button" class="btn btn-warning fw-bold px-4 rounded-pill text-dark"
                (click)="buscarPorNombre()">Buscar</button>
      </div>
    </div>

    <div class="col-md-6">
      <label class="form-label text-warning small fw-bold mb-2">BUSCAR POR INGREDIENTES</label>
      <div class="input-group bg-dark p-2 rounded-pill border border-secondary shadow">
        <input type="text" class="form-control bg-transparent text-white border-0 shadow-none px-3"
               placeholder="Ej: Chicken, Cheese, Garlic..."
               [(ngModel)]="ingredienteBusqueda" name="ingredienteBusqueda"
               (keyup.enter)="buscarPorIngrediente()">
        <button type="button" class="btn btn-warning fw-bold px-4 rounded-pill text-dark"
                (click)="buscarPorIngrediente()">Buscar</button>
      </div>
    </div>

  </div>

  <div class="text-center py-5" *ngIf="cargando">
    <div class="spinner-border text-warning" role="status"></div>
    <p class="text-secondary mt-3">Cargando platos...</p>
  </div>

  <div class="alert alert-warning text-center" *ngIf="mensaje && !cargando">{{ mensaje }}</div>

  <div *ngFor="let categoria of categorias" class="mb-5">

    <h3 class="text-warning fw-bold border-bottom border-secondary pb-2 mb-4 text-uppercase fs-4">
      {{ categoria.nombre }}
    </h3>

    <div class="row g-4">
      <div class="col-md-4" *ngFor="let comida of categoria.platos">
        <div class="card bg-dark text-white border-warning h-100 shadow-lg rounded-4 overflow-hidden">

          <img [src]="comida.imagen"
               class="card-img-top"
               [alt]="comida.nombre"
               style="height: 220px; object-fit: cover;">

          <div class="card-body d-flex flex-column justify-content-between p-4">
            <div>
              <h3 class="card-title text-warning h5 fw-bold">{{ comida.nombre }}</h3>
              <p class="text-secondary small mb-3"><strong>Ingredientes:</strong> {{ comida.ingredientes.join(', ') }}</p>
            </div>

            <div class="d-flex justify-content-between align-items-center pt-3 border-top border-secondary">
              <span class="fs-4 text-success fw-bold">${{ comida.precio | number }} COP</span>
              <button type="button" class="btn btn-outline-warning btn-sm fw-bold" (click)="pedir(comida)">Pedir</button>
            </div>
          </div>

        </div>
      </div>
    </div>

  </div>

</div>
